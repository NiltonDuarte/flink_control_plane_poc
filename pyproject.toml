[project]
name = "flink-control-plane-poc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "hypercorn>=0.17,<0.18",
    "pydantic>=2.13.4",
    "temporalio>=1.30,<2",
    "restate-sdk[serde]==1.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit",
    "ruff>=0.15.2",
    "restate-sdk[harness]==1.0.3",
]

[tool.ruff]
target-version = "py313"
exclude = ["temporal_app.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
