repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --select, I, --fix ]
        exclude: ^temporal_app\.py$
      # Run the formatter.
      - id: ruff-format
        exclude: ^temporal_app\.py$
